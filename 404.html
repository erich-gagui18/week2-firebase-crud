<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found — Student Records</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23000000'/%3E%3Cpath d='M6 9l6-3 6 3-6 3-6-3z' fill='%23fff'/%3E%3Cpath d='M8 11.5V16c0 1 1.8 2 4 2s4-1 4-2v-4.5' stroke='%23fff' stroke-width='1.4' fill='none'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0a0a0a;
      --paper: #f5f5f5;
      --surface: #ffffff;
      --black: #000000;
      --gray-950: #121212;
      --gray-900: #1a1a1a;
      --line: #dcdcdc;
      --muted: #595959;
      --muted-2: #8c8c8c;
      --font-display: "Space Grotesk", "Inter", sans-serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(circle at 1.5px 1.5px, rgba(0, 0, 0, 0.06) 1px, transparent 0) 0 0/26px 26px,
        var(--paper);
    }
    .mark {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.55);
      margin-bottom: 1.5rem;
    }
    #message {
      background: var(--surface);
      max-width: 420px;
      width: 100%;
      text-align: center;
      padding: 2.5rem 2rem 2rem;
      border-radius: 20px;
      border: 1px solid var(--line);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 20px 45px -18px rgba(0, 0, 0, 0.28);
    }
    .code {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff;
      background: var(--black);
      display: inline-block;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 2.4rem;
      line-height: 1;
      margin: 0 0 0.6rem;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    h2 {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0 0 0.6rem;
      color: var(--ink);
    }
    p { line-height: 1.5; margin: 0 0 1.5rem; font-size: 0.92rem; color: var(--muted); }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      text-decoration: none;
      background: var(--black);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      box-shadow: 0 8px 18px -8px rgba(0, 0, 0, 0.55);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    a.btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -8px rgba(0, 0, 0, 0.65); background: var(--gray-900); }
    #load {
      color: var(--muted-2);
      text-align: center;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      margin-top: 1.75rem;
    }
  </style>
</head>
<body>
  <div class="mark" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 9l8-4 8 4-8 4-8-4z" fill="#fff" />
      <path d="M7 11.2V17c0 1.4 2.2 2.6 5 2.6s5-1.2 5-2.6v-5.8" stroke="#fff" stroke-width="1.6" fill="none" />
    </svg>
  </div>
  <div id="message">
    <span class="code">404 error</span>
    <h1>404</h1>
    <h2>This page isn't in our records</h2>
    <p>The page you're looking for doesn't exist or may have moved. Check the URL, or head back to Student Records.</p>
    <a class="btn" href="/">Back to Student Records</a>
  </div>
  <p id="load">Student Records · Firebase Hosting</p>
</body>
</html>
